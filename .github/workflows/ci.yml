name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Authora.slnx

      - name: Build
        run: dotnet build Authora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Authora.Tests/Authora.Tests.csproj --configuration Release --no-build

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Authora.Core/Authora.Core.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion=0.1.0-ci.${{ github.run_number }}
          dotnet pack src/Authora.AspNetCore/Authora.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion=0.1.0-ci.${{ github.run_number }}
          dotnet pack src/Authora.EntityFrameworkCore/Authora.EntityFrameworkCore.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion=0.1.0-ci.${{ github.run_number }}
          dotnet pack src/Authora.Jwt/Authora.Jwt.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion=0.1.0-ci.${{ github.run_number }}
          dotnet pack src/Authora/Authora.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion=0.1.0-ci.${{ github.run_number }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: authora-nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
