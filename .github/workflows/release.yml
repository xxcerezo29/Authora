name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  package-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set release version
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Authora.slnx

      - name: Build
        run: dotnet build Authora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Authora.Tests/Authora.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Authora.Core/Authora.Core.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Authora.AspNetCore/Authora.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Authora.EntityFrameworkCore/Authora.EntityFrameworkCore.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Authora.Jwt/Authora.Jwt.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Authora/Authora.csproj --configuration Release --no-build --no-restore --output artifacts/packages /p:PackageVersion="$PACKAGE_VERSION"

      - name: Publish module packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "artifacts/packages/Authora.Core.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/xxcerezo29/index.json --skip-duplicate
          dotnet nuget push "artifacts/packages/Authora.AspNetCore.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/xxcerezo29/index.json --skip-duplicate
          dotnet nuget push "artifacts/packages/Authora.EntityFrameworkCore.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/xxcerezo29/index.json --skip-duplicate
          dotnet nuget push "artifacts/packages/Authora.Jwt.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/xxcerezo29/index.json --skip-duplicate

      - name: Publish umbrella package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet nuget push "artifacts/packages/Authora.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/xxcerezo29/index.json --skip-duplicate

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/packages/*.nupkg --clobber
